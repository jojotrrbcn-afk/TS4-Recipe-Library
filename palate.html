<style>
:root{--ink:#202c27;--muted:#65716a;--paper:#f8f7f1;--card:#fffefa;--green:#245b4b;--green2:#e9f1eb;--line:#dedfd7;--gold:#ad7744;--rose:#a95442;--shadow:0 16px 35px rgba(39,54,41,.045);--radius:16px;--focus:#b77d4c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}a{color:var(--green)}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.shell{max-width:1250px;margin:auto;padding:28px 26px 64px}.mast{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0 24px}.brand{display:flex;gap:14px;align-items:center}.logo{background:#245b4b;color:#fff;border-radius:14px;font-size:26px;width:53px;height:53px;display:grid;place-items:center}.eyebrow{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--gold);font-weight:750}.brand h1{font-family:Georgia,serif;font-size:32px;font-weight:500;margin:-2px 0 0;line-height:1.05}.subtitle{color:var(--muted);font-size:13px}.nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 0 16px;margin-bottom:28px}.nav button{border:1px solid transparent;background:transparent;color:#596a60;padding:11px 17px;border-radius:11px;font-weight:650}.nav button:hover{background:#f0f2e9}.nav button.active{background:var(--green);color:white}.section-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}.section-head h2{font:normal 30px/1.13 Georgia,serif;margin:0 0 5px}.section-head p{color:var(--muted);margin:0;font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--green);border-radius:10px;padding:10px 15px;background:var(--green);color:white;font-weight:650}.btn:hover{filter:brightness(1.12)}.btn.outline{color:var(--green);background:#fffefa}.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}.btn.danger{border-color:#b65d4b;color:#a94331;background:white}.btn.small{font-size:13px;padding:6px 10px;border-radius:8px}.btn.wide{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:19px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}.card h3{font:normal 24px Georgia,serif;margin:0 0 9px}.card h4{font-size:14px;margin:0 0 9px}.card p{color:var(--muted);margin:0 0 12px}.hint{font-size:12px;color:var(--muted)}.field{margin-bottom:16px}.field label{display:block;color:#36493e;font-size:13px;font-weight:700;margin:0 0 6px}.field input,.field select,.field textarea, .search{width:100%;padding:11px 12px;border:1px solid #cfd5ca;background:white;color:var(--ink);border-radius:9px;outline:none;min-width:0}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--green);box-shadow:0 0 0 2px #245b4b24}.field textarea{resize:vertical;min-height:80px}.field .hint{display:block;margin-top:5px}.split{display:grid;grid-template-columns:minmax(265px,380px) 1fr;gap:18px;align-items:start}.list{display:grid;gap:8px}.list-item{border:1px solid var(--line);background:white;padding:13px;border-radius:10px;text-align:left;color:var(--ink);width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center}.list-item.active{border-color:#245b4b;background:#edf4ed}.list-item strong{font-size:14px}.list-item small{color:var(--muted);display:block;font-size:12px}.count{padding:4px 8px;border-radius:20px;color:#506b5a;background:#eef1e9;font-size:12px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.tag{background:#eaf0e9;color:#315d47;border:1px solid #dde9df;border-radius:100px;padding:3px 9px;font-size:12px;display:inline-flex;gap:7px;align-items:center}.tag.negative{color:#9b4233;background:#fbefeb;border-color:#f4dcd6}.tag.neutral{background:#f0efe9;border-color:#e2e1da;color:#686a5e}.tag.special{background:#f5eedf;color:#805b29;border-color:#e9dec9}.tag button{padding:0;background:none;border:0;font-size:16px;line-height:1;color:inherit}.muted{color:var(--muted)}.tagline{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:750;margin:14px 0 8px}.separator{height:1px;background:var(--line);margin:20px 0}.empty{text-align:center;padding:38px 15px;color:var(--muted);border:1px dashed #cbd2c7;border-radius:12px}.empty strong{display:bl ground:white;color:var(--muted);border-radius:8px;padding:9px 1px;font-size:12px}.scorepick button.active{background:var(--green);color:white}.file-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toast{position:fixed;bottom:20px;right:20px;max-width:min(430px,calc(100% - 40px));z-index:100;background:#234f42;color:white;border-radius:11px;padding:14px 20px;box-shadow:0 12px 45px #0003;display:none}.toast.show{display:block}.mini{font-size:12px}.hidden{display:none!important}#recipe-form{margin-top:18px}.checkbox{display:flex;align-items:center;gap:8px;font-size:14px}.checkbox input{accent-color:var(--green);width:17px;height:17px}.guide ol{padding-left:20px}.guide li{margin-bottom:7px}.kbd{background:#ecf0e9;border:1px solid #d9e0d5;border-radius:4px;padding:1px 5px}footer a{color:var(--muted)}
@media(max-width:800px){.grid2,.grid3,.split,.pref-grid{grid-template-columns:1fr}.shell{padding:17px 14px 35px}.mast{align-items:flex-start}.brand h1{font-size:29px}.section-head h2{font-size:27px}.card{padding:17px}.nav{gap:3px}.nav button{font-size:13px;padding:9px 11px}.scorepick button{font-size:10px}.data-table{font-size:12px}.data-table td,.data-table th{padding:8px 4px}}

/* Favourite discovery and the at-a-glance recipe kanban */
.board-wrap{margin-top:20px}.board-intro{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.board-filter{width:auto;min-width:155px;border:1px solid var(--line);background:white;padding:8px 12px;border-radius:10px;color:var(--ink)}.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start;margin-top:16px}.kanban-col{background:#f4f5ef;border:1px solid var(--line);border-radius:13px;min-height:172px;padding:11px}.kanban-col h4{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:0 0 12px;font-size:13px}.kanban-col h4 span{background:white;padding:2px 7px;border-radius:100px;font-weight:600;color:var(--muted)}.kanban-col.loved{background:#f1f5ed}.kanban-col.disliked{background:#f9f1ed}.kanban-recipe{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:8px 9px;display:flex;gap:6px;align-items:center}.kanban-recipe:hover{border-color:#9aaf9d}.kanban-open{display:grid;gap:3px;flex:1;min-width:0;text-align:left;color:var(--ink);border:0;padding:0;background:transparent}.kanban-open b{font-size:13px;line-height:1.35;overflow-wrap:anywhere}.kanban-open small{color:var(--muted);font-size:11px}.fave-toggle{border:1px solid #e8ddc7;color:#9b865c;background:#fffdf7;min-height:32px;min-width:32px;border-radius:8px;font-size:18px;line-height:1}.fave-toggle.on{color:#986121;background:#faecd2;border-color:#ead5ae}.fave-toggle:hover{background:#f6eddb}.mini-empty{padding:12px 3px;color:var(--muted);font-size:12px}.favorite-list{margin-top:15px}.favorite-list .tag{margin-bottom:3px}.food-fave-button{background:#fff;border:1px solid #dfd4be;border-radius:7px;padding:2px 7px;color:#997547;cursor:pointer;font-size:12px}.favorite-title{font-size:13px;font-weight:700;margin-bottom:7px}.fav-hint{margin-top:10px;color:var(--muted);font-size:12px}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:550px){.kanban{grid-template-columns:1fr}.board-intro{align-items:stretch}.board-filter{width:100%}}
</style>

<style id="little-kitchen-palate-theme">
:root{
--ink:#30494B;--muted:#65736B;--paper:#EAE0CC;--card:#FFFDF9;
--green:#4D6A6D;--green2:#E4E5D7;--line:#D4C7B2;
--gold:#798478;--rose:#C9ADA1;--focus:#798478;
--shadow:0 7px 30px rgba(71,63,51,.045);
}
body{background:transparent;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:none;padding:4px 2px 20px}
.mast{display:none}
.nav button.active,.btn:not(.outline):not(.ghost):not(.danger),.scorepick button.active{background:var(--green);border-color:var(--green);color:white}

.tag.special{background:#EAE0CC;border-color:#D4C7B2;color:#4D6A6D}
.result{background:linear-gradient(135deg,#EEF0E8,#F3E2D9);border-color:#D4C7B2}
.kanban-col,.stat{background:#EEF0E8}
.kanban-col.loved{background:#E8EEE3}
.kanban-col.disliked{background:#F8EFEC}
.toast{background:#4D6A6D}
</style>

<body>
<div class="shell">
  <header class="mast"><div class="brand"><div class="logo" aria-hidden="true">✿</div><div><div class="eyebrow">A Sims 4 companion</div><h1>The Palate</h1><div class="subtitle">Personal tastes, discovered one recipe at a time.</div></div></div><div class="actions"><button class="btn outline small" data-action="export-data">⇩ Back up</button></div></header>
  <nav class="nav" aria-label="Main sections">
    <button data-nav="taste" class="active">Taste test</button><button data-nav="sims">My Sims</button><button data-nav="recipes">Taste details</button><button data-nav="history">Taste history</button><button data-nav="data">Data & help</button>
  </nav>
  <div id="warning"></div>
  <main id="main" aria-live="polite"></main>
  <div class="footer">Offline, private, subscription-free. Save a backup occasionally, especially before clearing browser data.</div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='ts4-the-palate-v1';
const KITCHEN_KEY='little-sim-kitchen-recipes-v1';
const TYPES={ingredients:'Ingredients',flavours:'Flavours',textures:'Textures',cuisines:'Cuisines',types:'Food & drink types'};
const RATING=['','Hates it','Dislikes it','Neutral','Likes it','Loves it'];
const PREF={ '-2':'Hates', '-1':'Dislikes', '0':'Neutral', '1':'Likes', '2':'Loves'};
const DEFAULT={version:1,sims:[],recipes:[],history:[]};
let state=load();let tab='taste', simChoice='', recipeChoice='', chosenSim='', chosenRecipe='', editingSim=false,editingRecipe=false,searchRecipes='',searchSims='',kindFilter='all',boardKind='all',lastOutcome=null;
const $=sel=>document.querySelector(sel);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=> (globalThis.crypto && crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const clean=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
const tags=s=>Array.from(new Set(String(s||'').split(/[,;|]/).map(clean).filter(Boolean)));
const pretty=s=>String(s).split(' ').map(t=>t[0]?t[0].toUpperCase()+t.slice(1):'').join(' ');
function load(){try{const obj=JSON.parse(localStorage.getItem(KEY));if(obj && obj.version===1 && Array.isArray(obj.sims)&&Array.isArray(obj.recipes)&&Array.isArray(obj.history))return obj;}catch(e){}return structuredClone(DEFAULT)}

/* Kitchen recipes are the shared source. Sim ratings and taste tags remain independent. */
function syncKitchenRecipes(){
  let raw,kitchen;
  try{
    raw=localStorage.getItem(KITCHEN_KEY);
    if(raw===null)return false;
    kitchen=JSON.parse(raw);
    if(!Array.isArray(kitchen))return false;
  }catch(e){return false}
  const valid=kitchen.filter(r=>r&&typeof r.id==='string'&&r.id&&typeof r.name==='string'&&r.name.trim());
  const ids=new Set(valid.map(r=>r.id));
  const kitchenNames=new Map();
  valid.forEach(r=>{const n=clean(r.name);kitchenNames.set(n,(kitchenNames.get(n)||0)+1)});
  const linked=new Map(state.recipes.filter(r=>r.kitchenRecipeId).map(r=>[r.kitchenRecipeId,r]));
  const manualByName=new Map();
  state.recipes.filter(r=>!r.kitchenRecipeId).forEach(r=>{
    const n=clean(r.name);
    if(!manualByName.has(n))manualByName.set(n,[]);
    manualByName.get(n).push(r);
  });
  const claimed=new Set(),usedIds=new Set(state.recipes.map(r=>r.id));
  let changed=false;
  for(const item of valid){
    let entry=linked.get(item.id);
    if(!entry&&kitchenNames.get(clean(item.name))===1){
      const options=manualByName.get(clean(item.name))||[];
      if(options.length===1&&!claimed.has(options[0].id)){
        entry=options[0];
        claimed.add(entry.id);
      }
    }
    if(!entry){
      let id='kitchen:'+item.id;
      if(usedIds.has(id))id=uid();
      usedIds.add(id);
      entry={id,name:'',kind:'Food',ingredients:[],prominent:[],flavours:[],textures:[],cuisines:[],types:[],notes:''};
      state.recipes.push(entry);
      changed=true;
    }
    const ingredients=Array.isArray(item.ingredients)?
      Array.from(new Set(item.ingredients.filter(x=>typeof x==='string').map(clean).filter(Boolean))):[];
    const meal=String(item.meal||'Other');
    const fields={
      kitchenRecipeId:item.id,
      name:item.name.trim(),
      kind:meal==='Drinks'?'Drink':'Food',
      ingredients,
      kitchenCreator:String(item.creator||'').trim(),
      kitchenMeal:meal,
      kitchenUrl:String(item.url||''),
      kitchenSkillType:String(item.skillType||''),
      kitchenSkillLevel:item.skillLevel===null||item.skillLevel===undefined?null:item.skillLevel,
      kitchenNotes:String(item.notes||'')
    };
    for(const [key,value] of Object.entries(fields)){
      if(JSON.stringify(entry[key])!==JSON.stringify(value)){entry[key]=value;changed=true}
    }
    if(!Array.isArray(entry.types)||!entry.types.length){
      entry.types=meal&&meal!=='Other'?[clean(meal)]:[];
      changed=true;
    }
  }
  const before=state.recipes.length;
  // Removed Kitchen recipes vanish from active taste testing, without erasing
  // past Sim opinions, favourites or tasting history.
  state.recipes=state.recipes.filter(r=>!r.kitchenRecipeId||ids.has(r.kitchenRecipeId));
  if(state.recipes.length!==before)changed=true;
  if(changed)save();
  return changed;
}

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#warning').innerHTML='';return true}catch(e){$('#warning').innerHTML='<div class="alert">⚠ Could not store changes in this browser. Export a JSON backup now. The browser may be in private mode or out of storage.</div>';return false}}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3500)}
function bySim(){return state.sims.find(s=>s.id===simChoice)}
function byRecipe(){return state.recipes.find(r=>r.id===recipeChoice)}
function pvals(s){if(!s.prefs||typeof s.prefs!=='object')s.prefs={};for(const k of Object.keys(TYPES))if(!s.prefs[k]||typeof s.prefs[k]!=='object')s.prefs[k]={};if(!s.ratings||typeof s.ratings!=='object')s.ratings={};if(!s.favourites||typeof s.favourites!=='object')s.favourites={};for(const k of ['foods','recipes','drinks'])if(!Array.isArray(s.favourites[k]))s.favourites[k]=[];return s}
function ensureSelection(){if(!state.sims.some(s=>s.id===simChoice))simChoice=state.sims[0]?.id||'';if(!state.recipes.some(r=>r.id===recipeChoice))recipeChoice=state.recipes[0]?.id||'';if(!state.sims.some(s=>s.id===chosenSim))chosenSim=state.sims[0]?.id||'';if(!state.recipes.some(r=>r.id===chosenRecipe))chosenRecipe=state.recipes[0]?.id||''}
function opts(items,selected,placeholder){return '<option value="">'+esc(placeholder||'Choose...')+'</option>'+items.map(i=>`<option value="${esc(i.id)}" ${i.id===selected?'selected':''}>${esc(i.name)}</option>`).join('')}
function bar(score){return '<div class="scores" aria-label="'+esc(score)+' out of 5">'+[1,2,3,4,5].map(n=>`<span class="${n<=score?'fill':''}"></span>`).join('')+'</div>'}
function tagnode(s,cls=''){return `<span class="tag ${cls}">${esc(pretty(s))}</span>`}
function section(title,desc,buttons=''){return `<div class="section-head"><div><h2>${title}</h2><p>${desc}</p></div><div class="actions">${buttons}</div></div>`}
function render(){ensureSelection();$('.nav button.active')?.classList.remove('active');$(`[data-nav="${tab}"]`)?.classList.add('active');$('#main').innerHTML=({taste:renderTaste,sims:renderSims,recipes:renderRecipes,history:renderHistory,data:renderData}[tab])();}
function renderTaste(){let sim=state.sims.find(s=>s.id===chosenSim),recipe=state.recipes.find(r=>r.id===chosenRecipe),rated=sim&&recipe?pvals(sim).ratings[recipe.id]:null;
let ready=!!sim&&!!recipe;
return section('The first taste','Discover consistent, individual reactions to any food or drink, including custom recipes.')+
 (!state.sims.length||!state.recipes.length?`<div class="alert">To begin, add at least one Sim and one recipe. You can also load the optional demonstration data under <b>Data & help</b>.</div>`:'')+
 `<div class="grid2"><div class="card"><h3>Who is tasting?</h3><div class="field"><label for="taste-sim">Sim</label><select id="taste-sim" data-change="taste-sim">${opts(state.sims,chosenSim,'Add a Sim first')}</select></div><div class="field"><label for="taste-recipe">Recipe or drink</label><select id="taste-recipe" data-change="taste-recipe">${opts(state.recipes,chosenRecipe,'Add a recipe first')}</select></div>
 ${recipe?`<div class="tagline">${esc(recipe.kind||'Food')} · ${esc(recipe.name)}</div>${tagDetails(recipe)}`:''}
 <div class="separator"></div><button class="btn wide" data-action="taste" ${ready?'':'disabled'}>${rated?'Log another tasting':'Discover first taste'}</button>
 <p class="notice">Recipes themselves are never randomly selected. Only previously unknown tastes are discovered, once per Sim, and saved.</p></div>
 <div class="card"><h3>Personal verdict</h3>${!ready?`<div class="empty">Select a Sim and recipe to see their taste profile.</div>`:rated?showRating(sim,recipe,rated):`<div class="empty"><strong>Not yet tasted</strong>No saved opinion of ${esc(recipe.name)}. Discover their preferences through the first tasting.</div>`}
 </div></div>
 ${ready?`<div class="grid2" style="margin-top:18px"><div class="card"><h3>${esc(sim.name)}'s palate</h3><p>Known preferences that can affect this or future recipes.</p>${prefSummary(sim)}<button class="btn outline small" data-action="edit-selected-sim">Edit preferences</button></div><div class="card"><h3>Recipe-specific exception</h3><p>Some dishes are exceptions to general preferences. Override the verdict without changing the Sim's overall palate.</p><div class="field"><label for="manual-rating">Set personal opinion of this recipe</label><select id="manual-rating"><option value="">Choose a rating…</option>${[1,2,3,4,5].map(v=>`<option value="${v}" ${rated?.source==='manual'&&rated.score===v?'selected':''}>${v} · ${RATING[v]}</option>`).join('')}</select></div><div class="actions"><button class="btn" data-action="manual-rating">Save opinion</button><button class="btn outline" data-action="recalculate" ${rated?'':'disabled'}>Re-evaluate</button></div><p class="notice">Re-evaluate uses current preferences and restores an automatic rating. It doesn't reroll known tastes.</p></div></div>`:''}`}
function showRating(sim,recipe,r){let why=(r.reasons||[]).slice(0,14);let latest=lastOutcome?.simId===sim.id&&lastOutcome?.recipeId===recipe.id?lastOutcome:null;

function renderData(){return section('Data & help','Keep full control of your recipes and preferences. Everything is stored on this device.')+`<div class="grid2"><div class="card"><h3>Back up and restore</h3><p>Export a full JSON backup to preserve Sims, recipes, ratings and history. Import it later to restore your library.</p><div class="stack"><button class="btn" data-action="export-data">Download full backup (.json)</button><button class="btn outline" data-action="import-json-trigger">Restore a backup (.json)</button><button class="btn ghost" data-action="export-recipes">Export recipes (.csv)</button><button class="btn ghost" data-action="import-csv-trigger">Import recipes (.csv)</button></div><input id="json-file" class="hidden" type="file" accept=".json,application/json"/><input id="csv-file" class="hidden" type="file" accept=".csv,text/csv"/><div class="separator"></div><p class="hint">Important: Browser data may disappear if you clear website data or use private browsing. Backups are stored wherever you save the download, not automatically uploaded anywhere. Before opening a new app version or using a renamed HTML file, export a full JSON backup from the old app and restore it in the new version if your data does not appear.</p></div><div class="card"><h3>Quick start</h3><div class="guide"><ol><li>Create a Sim in <b>My Sims</b>.</li><li>Add recipes in Little Sim Kitchen's main <b>Recipes</b> tab. They appear here automatically. Add flavours and other taste tags under <b>Taste details</b>.</li><li>Open <b>Taste test</b>, select a Sim and a recipe, then tap <b>Discover first taste</b>.</li><li>The app discovers unknown tastes once and keeps the resulting recipe opinion.</li><li>Open <b>My Sims</b> to see the recipe kanban board, discover favourites, change known tastes or set recipe exceptions.</li></ol></div><button class="btn outline" data-action="demo">Load optional demo data</button><p class="notice">Demo includes 3 fictional Sims and 6 tagged example recipes. It adds to your current data without deleting it.</p></div></div><div class="grid2" style="margin-top:18px"><div class="card"><h3>CSV import format</h3><p>The importer recognises recipe <b>name</b>, <b>kind</b>, <b>ingredients</b>, <b>prominent</b>, <b>flavours</b>, <b>textures</b>, <b>cuisines</b>, <b>types</b>, and <b>notes</b> columns.</p><p class="notice">Tags within a cell should be separated by semicolons. An alternative <b>recipe</b> or <b>title</b> column can stand in for name. If you import from a different recipe system, the app won't be able to infer ingredients or flavour tags it wasn't given. You can add those later.</p><button class="btn ghost small" data-action="template-csv">Download CSV template</button></div><div class="card"><h3>How tastes are determined</h3><p>Previously unknown ingredients, flavours, textures, cuisines and types get a random personal preference once per Sim: 5% Hates, 20% Dislikes, 45% Neutral, 25% Likes, 5% Loves.</p><p>Prominent ingredients matter more than cuisine. A strong aversion to a prominent ingredient generally limits the rating to <b>Dislikes</b>. Saved recipe ratings do not change automatically, though you can re-evaluate them or manually set a recipe exception. A small chance on a newly discovered 5/5 recipe or drink marks it as a favourite, and newly discovered loved ingredients can become favourite foods. Manual ★ overrides are available. Favourites remain personal to each Sim.</p><p class="hint">This is a browser companion, not an in-game Sims 4 mod. It cannot detect meals eaten inside the game automatically.</p></div></div><div class="card" style="margin-top:18px"><div class="row"><div><h3>Reset all app data</h3><p>Permanently deletes the saved data from this browser. Export a backup first.</p></div><button class="btn danger" data-action="reset-all">Erase local data</button></div></div>`}
function rand(){if(globalThis.crypto?.getRandomValues){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}return Math.random()}
function discover(){let n=rand();return n<.05?-2:n<.25?-1:n<.7?0:n<.95?1:2}
function tasteProfile(sim,r){pvals(sim);let discovered=[],newFavouriteFoods=[],matches=[],total=0,weighted=0;const w={ingredients:.85,flavours:1.25,textures:1.10,cuisines:.60,types:.75};let veto=false;
for(const k of Object.keys(TYPES)){for(const tag of r[k]||[]){if(!Object.prototype.hasOwnProperty.call(sim.prefs[k],tag)){let value=discover();sim.prefs[k][tag]=value;discovered.push({kind:k,tag,value});if(k==='ingredients'&&value===2&&rand()<.18&&!sim.favourites.foods.includes(tag)){sim.favourites.foods.push(tag);newFavouriteFoods.push(tag)}}const value=Number(sim.prefs[k][tag]);const factor=k==='ingredients'&&(r.prominent||[]).includes(tag)?2.2:w[k];if(value!==0){total+=factor;weighted+=factor*value;matches.push({tag,kind:k,value})}if(k==='ingredients'&&(r.prominent||[]).includes(tag)&&value===-2)veto=true}}
let score=total?Math.max(1,Math.min(5,3+Math.round(weighted/total))):3;if(veto)score=Math.min(2,score);
return {score,reasons:matches,veto,discovered,newFavouriteFoods}}
function log(sim,r,score,event){state.history.push({id:uid(),simId:sim.id,recipeId:r.id,simName:sim.name,recipeName:r.name,time:new Date().toISOString(),score,event});if(state.history.length>20000)state.history=state.history.slice(-20000)}
function doTaste(recalculate=false){const s=state.sims.find(x=>x.id===chosenSim),r=state.recipes.find(x=>x.id===chosenRecipe);if(!s||!r)return;pvals(s);let old=s.ratings[r.id];if(old&&!recalculate){log(s,r,old.score,'Repeat tasting');save();lastOutcome=null;toast(`${s.name} still ${old.score===3?'feels neutral about':RATING[old.score].toLowerCase().replace(' it','')} ${r.name}.`);render();return}let result=tasteProfile(s,r);s.ratings[r.id]={score:result.score,reasons:result.reasons,veto:result.veto,source:'automatic',time:new Date().toISOString()};let favouriteDiscovered=false;if(!old&&result.score===5&&rand()<.18){setFavouriteRecipe(s,r,true);favouriteDiscovered=true}if(result.score<4)setFavouriteRecipe(s,r,false);log(s,r,result.score,old?'Re-evaluated':'First taste');lastOutcome={simId:s.id,recipeId:r.id,discovered:result.discovered};save();render();toast(favouriteDiscovered||result.newFavouriteFoods.length?'A new favourite was discovered!':result.discovered.length?`${result.discovered.length} new personal tastes discovered.`:'Verdict saved. No new tastes needed.')}
function download(name,text,mime){let url=URL.createObjectURL(new Blob([text],{type:mime}));let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function date(){return new Date().toISOString().slice(0,10)}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function makeCSV(rows){return '\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n')}
function exportRecipes(){let keys=['name','kind','ingredients','prominent','flavours','textures','cuisines','types','notes'];download('the-palate-recipes-'+date()+'.csv',makeCSV([keys,...state.recipes.map(r=>keys.map(k=>Array.isArray(r[k])?r[k].join('; '):(r[k]||'')))]),'text/csv;charset=utf-8')}
function exportHistory(){let h=['date','sim','recipe','rating','score','event'];download('the-palate-history-'+date()+'.csv',makeCSV([h,...state.history.map(x=>[x.time,x.simName,x.recipeName,RATING[x.score],x.score,x.event])]),'text/csv;charset=utf-8')}
function validateJSON(x){if(!x||x.version!==1||!Array.isArray(x.sims)||!Array.isArray(x.recipes)||!Array.isArray(x.history))throw Error('Not a valid The Palate backup.');if(x.sims.length>20000||x.recipes.length>100000||x.history.length>100000)throw Error('File is too large.');for(const s of x.sims){if(!s||typeof s.id!=='string'||typeof s.name!=='string')throw Error('A Sim record is invalid.');pvals(s)}for(const r of x.recipes){if(!r||typeof r.id!=='string'||typeof r.name!=='string')throw Error('A recipe record is invalid.');for(const k of [...Object.keys(TYPES),'prominent'])r[k]=Array.isArray(r[k])?r[k].filter(v=>typeof v==='string').map(clean):[];}return x}
function parseCSV(text){let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else{if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}}if(quoted)throw Error('Invalid CSV: unclosed quote.');row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
function fromCSV(text){const rows=parseCSV(text.replace(/^\ufeff/,''));if(rows.length<2)throw Error('CSV has no data rows.');const headers=rows[0].map(s=>clean(s).replace(/\s+/g,'_'));let idx=names=>headers.findIndex(x=>names.includes(x));const nameCol=idx(['name','recipe','recipe_name','title','food_name','dish']);if(nameCol<0)throw Error('CSV needs a name, recipe or title column.');let seen=new Set(state.recipes.map(x=>clean(x.name)));let added=0,skipped=0;
for(const row of rows.slice(1)){let name=String(row[nameCol]||'').trim();if(!name||seen.has(clean(name))){skipped++;continue}let get=keys=>{let n=idx(keys);return n<0?'':row[n]||''};let r={id:uid(),name:name.slice(0,140),kind:/drink|beverage|cocktail|coffee|tea/i.test(get(['kind','category','meal_type']))?'Drink':'Food',notes:get(['notes','description','source'])};
for(const [k,aliases] of Object.entries({ingredients:['ingredients','ingredient'],prominent:['prominent','prominent_ingredients','main_ingredients'],flavours:['flavours','flavors','flavour','flavor','taste'],textures:['textures','texture'],cuisines:['cuisines','cuisine'],types:['types','type','recipe_type','food_type']}))r[k]=tags(get(aliases));
if(!r.prominent.length && r.ingredients.length===1)r.prominent=[r.ingredients[0]];state.recipes.push(r);seen.add(clean(name));added++}
save();return {added,skipped}}
async function importJSON(file){try{let x=validateJSON(JSON.parse(await file.text()));if(!confirm(`Replace all local data with this backup?\n\n${x.sims.length} Sims, ${x.recipes.length} recipes and ${x.history.length} history entries.\n\nThis will overwrite everything currently in this browser. Export a backup first if needed.`))return;state=x;lastOutcome=null;editingSim=false;editingRecipe=false;simChoice='';recipeChoice='';chosenSim='';chosenRecipe='';save();syncKitchenRecipes();render();toast('Backup restored successfully.')}catch(e){alert('Could not restore backup: '+e.message)}}
async function importCSV(file){try{let {added,skipped}=fromCSV(await file.text());render();toast(`Imported ${added} recipes. ${skipped} empty or duplicate rows skipped.`)}catch(e){alert('Could not import recipes: '+e.message)}}
function demo(){const sampleSims=[{name:'Amelia Harper',notes:'Adventurous with spice, strongly dislikes avocado.',prefs:{ingredients:{avocado:-2,chicken:1},flavours:{spicy:2},textures:{crunchy:1}}},{name:'Daniel Brooks',notes:'Prefers comforting, creamy dishes.',prefs:{ingredients:{avocado:1,seafood:-1},textures:{creamy:2},flavours:{spicy:-1}}},{name:'Sophie Morgan',notes:'Seafood enthusiast; dislikes coconut.',prefs:{ingredients:{seafood:2,coconut:-2},flavours:{bitter:1},textures:{crispy:1}}}];const sampleRecipes=[['Avocado Toast','Food','avocado, egg, bread','avocado','savoury','creamy, crunchy','','breakfast'],['Thai Red Chicken Curry','Food','chicken, coconut','chicken, coconut','spicy','creamy','thai','curry'],['Seafood Risotto','Food','seafood, rice','seafood','savoury','creamy','italian','rice dish'],['Iced Caramel Coffee','Drink','coffee, milk','coffee','sweet, bitter','creamy','','coffee, cold drink'],['Mushroom Soup','Food','mushroom, cream','mushroom','savoury','creamy','','soup'],['Mango Smoothie','Drink','mango, yoghurt','mango','sweet','smooth, creamy','','smoothie']];let count=0;for(const x of sampleSims){if(state.sims.some(s=>s.name===x.name))continue;let s={id:uid(),name:x.name,notes:x.notes,prefs:x.prefs,ratings:{}};pvals(s);state.sims.push(s);count++}for(const a of sampleRecipes){if(state.recipes.some(r=>r.name===a[0]))continue;state.recipes.push({id:uid(),name:a[0],kind:a[1],ingredients:tags(a[2]),prominent:tags(a[3]),flavours:tags(a[4]),textures:tags(a[5]),cuisines:tags(a[6]),types:tags(a[7]),notes:'Illustrative demo recipe; edit or delete freely.'});count++}save();render();toast(count?`Added ${count} sample Sims and recipes.`:'Demo data was already present.')}
// Main event handling, kept separate from dynamic markup.
document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){tab=nav.dataset.nav;editingSim=false;editingRecipe=false;lastOutcome=null;render();return}let btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;
switch(action){
case 'export-data':download('the-palate-backup-'+date()+'.json',JSON.stringify(state,null,2),'application/json');toast('Backup downloaded.');break;
case 'export-recipes':exportRecipes();break;case 'export-history':exportHistory();break;
case 'template-csv':download('the-palate-template.csv',makeCSV([['name','kind','ingredients','prominent','flavours','textures','cuisines','types','notes'],['Example Dish','Food','tomato; cheese','tomato','savoury','creamy','italian','pasta','Replace this example']]),'text/csv;charset=utf-8');break;
case 'import-csv-trigger':$('#csv-file')?.click();break;case 'import-json-trigger':$('#json-file')?.click();break;
case 'demo':demo();break;case 'new-sim':editingSim='new';render();break;case 'cancel-sim':editingSim=false;render();break;
case 'select-sim':simChoice=btn.dataset.id;editingSim=false;render();break;
case 'board-to-taste':{let r=state.recipes.find(x=>x.id===btn.dataset.id),sim=bySim();if(!r||!sim)return;chosenSim=sim.id;chosenRecipe=r.id;tab='taste';lastOutcome=null;render();break}
case 'toggle-recipe-fave':{let r=state.recipes.find(x=>x.id===btn.dataset.id),sim=tab==='sims'?bySim():state.sims.find(x=>x.id===chosenSim);if(!r||!sim)return;pvals(sim);if(!sim.ratings[r.id]||Number(sim.ratings[r.id].score)<4){toast('Only liked or loved recipes can be marked as favourites.');break}const next=!isFavouriteRecipe(sim,r);setFavouriteRecipe(sim,r,next);save();render();toast(next?'Added to personal favourites.':'Removed from favourites.');break}
case 'toggle-food-fave':{let sim=bySim(),tag=clean(btn.dataset.tag);if(!sim||!tag)return;pvals(sim);if(Number(sim.prefs.ingredients[tag])<1){toast('Favourites must be ingredients this Sim likes or loves.');break}const a=sim.favourites.foods;sim.favourites.foods=a.includes(tag)?a.filter(x=>x!==tag):[...a,tag];save();render();toast(a.includes(tag)?'Removed favourite food.':'Added favourite food.');break}case 'edit-sim':case 'edit-selected-sim':if(action==='edit-selected-sim'){simChoice=chosenSim;tab='sims'}editingSim=true;render();break;
case 'delete-sim':{let s=bySim();if(s&&confirm(`Delete ${s.name} and their saved preferences and ratings? Their historical taste records will remain.`)){state.sims=state.sims.filter(x=>x.id!==s.id);save();render();toast('Sim deleted.')}break}
case 'new-recipe':editingRecipe='new';render();break;case 'cancel-recipe':editingRecipe=false;render();break;
case 'select-recipe':recipeChoice=btn.dataset.id;editingRecipe=false;render();break;case 'edit-recipe':editingRecipe=true;render();break;
case 'delete-recipe':{let r=byRecipe();if(r&&confirm(`Delete ${r.name}? Previous tasting history will remain, but this recipe and its saved opinions will be removed.`)){state.recipes=state.recipes.filter(x=>x.id!==r.id);for(let s of state.sims){delete pvals(s).ratings[r.id];setFavouriteRecipe(s,r,false)}save();render();toast('Recipe deleted.')}break}
case 'test-recipe':chosenRecipe=recipeChoice;tab='taste';render();break;
case 'taste':doTaste();break;case 'recalculate':doTaste(true);break;
case 'manual-rating':{let s=state.sims.find(x=>x.id===chosenSim),r=state.recipes.find(x=>x.id===chosenRecipe),score=Number($('#manual-rating')?.value);if(!s||!r||![1,2,3,4,5].includes(score)){toast('Choose a rating first.');break}let old=pvals(s).ratings[r.id];s.ratings[r.id]={score,source:'manual',reasons:old?.reasons||[],veto:false,time:new Date().toISOString()};if(score<4)setFavouriteRecipe(s,r,false);log(s,r,score,'Manual recipe exception');save();lastOutcome=null;render();toast('Personal recipe opinion saved.');break}
case 'delete-pref':{let s=bySim(),k=btn.dataset.kind,t=btn.dataset.tag;if(s?.prefs?.[k]&&confirm(`Remove ${pretty(t)} from ${s.name}'s known preferences?`)){delete s.prefs[k][t];if(k==='ingredients')s.favourites.foods=s.favourites.foods.filter(x=>x!==t);save();render()}break}
case 'reset-all':if(confirm('ERASE all Sims, recipes, preferences, ratings and history from this browser? This cannot be undone unless you have a JSON backup.')&&confirm('Final confirmation: delete all data?')){state=structuredClone(DEFAULT);simChoice='';recipeChoice='';chosenSim='';chosenRecipe='';editingSim=false;editingRecipe=false;lastOutcome=null;save();syncKitchenRecipes();tab='data';render();toast('Sim tastes reset. Kitchen recipes remain available.')}break;
}});
document.addEventListener('submit',e=>{if(!['sim-form','recipe-form','pref-form'].includes(e.target.id))return;e.preventDefault();let d=new FormData(e.target);
if(e.target.id==='sim-form'){let name=String(d.get('name')||'').trim();if(!name)return;let existing=editingSim==='new'?null:bySim();if(existing){existing.name=name;existing.notes=String(d.get('notes')||'')}else{let s={id:uid(),name,notes:String(d.get('notes')||''),prefs:{},ratings:{}};pvals(s);state.sims.push(s);simChoice=s.id;chosenSim=s.id}editingSim=false;save();render();toast('Sim saved.');return}
if(e.target.id==='recipe-form'){let name=String(d.get('name')||'').trim();if(!name)return;let r=(editingRecipe==='new'?null:byRecipe())||{id:uid()};if(!r.kitchenRecipeId){r.name=name;r.kind=d.get('kind')==='Drink'?'Drink':'Food'}r.notes=String(d.get('notes')||'');for(const k of [...Object.keys(TYPES),'prominent']){if(r.kitchenRecipeId&&k==='ingredients')continue;r[k]=tags(d.get(k))}if(!state.recipes.some(x=>x.id===r.id)){state.recipes.push(r);chosenRecipe=r.id}recipeChoice=r.id;editingRecipe=false;save();render();toast('Taste details saved.');return}
if(e.target.id==='pref-form'){let s=bySim();if(!s)return;let k=String(d.get('kind')),t=clean(d.get('tag')),v=Number(d.get('value'));if(!TYPES[k]||!t||![-2,-1,0,1,2].includes(v))return;pvals(s).prefs[k][t]=v;if(k==='ingredients'&&v<1)s.favourites.foods=s.favourites.foods.filter(x=>x!==t);save();render();toast(`Saved ${pretty(t)} preference.`);return}});
document.addEventListener('change',async e=>{let t=e.target;if(t.id==='json-file'&&t.files?.[0]){await importJSON(t.files[0]);t.value='';return}if(t.id==='csv-file'&&t.files?.[0]){await importCSV(t.files[0]);t.value='';return}let a=t.dataset.change;if(!a)return;switch(a){case 'taste-sim':chosenSim=t.value;lastOutcome=null;render();break;case 'taste-recipe':chosenRecipe=t.value;lastOutcome=null;render();break;case 'board-kind':boardKind=t.value;render();break;case 'kind-filter':kindFilter=t.value;render();break;case 'pref-edit':{let s=bySim(),k=t.dataset.kind,tag=t.dataset.tag;if(s?.prefs?.[k]&&Object.hasOwn(s.prefs[k],tag)){s.prefs[k][tag]=Number(t.value);if(k==='ingredients'&&Number(t.value)<1)s.favourites.foods=s.favourites.foods.filter(x=>x!==tag);save();render();toast('Preference updated.')}break}}});
document.addEventListener('input',e=>{const a=e.target.dataset.input;if(!a)return;const caret=e.target.selectionStart;const id=e.target.id;if(a==='recipe-search')searchRecipes=e.target.value;if(a==='sim-search')searchSims=e.target.value;render();let f=$('#'+id);if(f){f.focus();f.setSelectionRange(caret,caret)}});
window.addEventListener('storage',e=>{if(e.key===KITCHEN_KEY){syncKitchenRecipes();render()}});
window.addEventListener('message',e=>{if(e.source!==window.parent||e.origin!==window.location.origin||e.data?.type!=='little-kitchen-sync')return;syncKitchenRecipes();render()});
// First paint.
syncKitchenRecipes();
render();
})();
</script>

<script>
(() => {
  if (window.parent === window) return;
  let lastHeight = 0;
  function announceHeight() {
    const root = document.querySelector('.shell');
    if (!root) return;
    const height = Math.ceil(root.getBoundingClientRect().height + 12);
    if (height !== lastHeight) {
      lastHeight = height;
      window.parent.postMessage({ type: 'little-kitchen-palate-height', height }, window.location.origin);
    }
  }
  window.addEventListener('load', announceHeight);
  window.addEventListener('resize', announceHeight);
  if (typeof ResizeObserver === 'function') {
    const observer = new ResizeObserver(announceHeight);
    observer.observe(document.querySelector('.shell'));
  }
  document.addEventListener('click', () => requestAnimationFrame(announceHeight));
  announceHeight();
})();
</script>
